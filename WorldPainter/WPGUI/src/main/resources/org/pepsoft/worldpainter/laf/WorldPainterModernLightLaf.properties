# WorldPainter Modern, light: a window of soft grey with raised white surfaces, a blue accent, softly rounded
# controls, and selections filled with the accent. Builds on WorldPainterLightLaf.properties (Classic), of which it
# overrides the colours and shapes.
#
# Neutrals: #ffffff surface, #f5f5f7 window, #ececf0 fill, #e3e3e8 hairline, #d9d9de border, #c7c7cc strong border,
# #aeaeb2 disabled, #6e6e73 secondary text, #1d1d1f text. Accent: #0071e3, pressed #0062c4, tint #e1edfd.

#---- Base ----

@background = #f5f5f7
@foreground = #1d1d1f
@accentColor = #0071e3
@disabledForeground = #aeaeb2
@selectionBackground = #0071e3
@selectionForeground = #ffffff
@selectionInactiveBackground = #e3e3e8

Component.arc = 10
Button.arc = 10
TextComponent.arc = 10
CheckBox.arc = 6
ProgressBar.arc = 999
Component.borderColor = #d9d9de
Component.disabledBorderColor = #e3e3e8
Component.focusedBorderColor = #0071e3
Component.focusColor = #0071e333
Component.innerFocusWidth = 0
Component.focusWidth = 3
Component.accentColor = #0071e3
Component.linkColor = #0062c4

Panel.background = #f5f5f7
Label.disabledForeground = #aeaeb2
Separator.foreground = #e3e3e8
TitledBorder.titleColor = #6e6e73

#---- Buttons ----

Button.background = #ffffff
Button.borderColor = #d9d9de
Button.hoverBackground = #fafafc
Button.pressedBackground = #ececf0
Button.focusedBorderColor = #0071e3
Button.disabledBorderColor = #e3e3e8
Button.default.background = #0071e3
Button.default.foreground = #ffffff
Button.default.borderColor = #0071e3
Button.default.hoverBackground = #0a7aec
Button.default.pressedBackground = #0062c4
Button.default.focusedBorderColor = #0071e3
Button.default.focusedBackground = #0071e3
Button.default.hoverBorderColor = #0a7aec
Button.default.boldText = true
Button.toolbar.hoverBackground = #e8e8ed
Button.toolbar.pressedBackground = #dcdce1
Button.toolbar.selectedBackground = #e1edfd
Button.toolbar.margin = 5,5,5,5
ToggleButton.selectedBackground = #e1edfd
ToggleButton.selectedForeground = #0058b0
ToggleButton.toolbar.selectedBackground = #e1edfd
ToggleButton.toolbar.hoverBackground = #e8e8ed

CheckBox.icon.borderColor = #c7c7cc
CheckBox.icon.selectedBorderColor = #0071e3
CheckBox.icon.selectedBackground = #0071e3
CheckBox.icon.checkmarkColor = #ffffff
CheckBox.icon.focusedBorderColor = #0071e3
CheckBox.icon.hoverBorderColor = #aeaeb2

#---- Text fields, combo boxes and spinners ----

TextField.background = #ffffff
FormattedTextField.background = #ffffff
ComboBox.background = #ffffff
Spinner.background = #ffffff
TextComponent.selectionBackground = #b8d6fb
ComboBox.buttonArrowColor = #6e6e73
ComboBox.selectionBackground = #0071e3
ComboBox.selectionForeground = #ffffff
Spinner.buttonArrowColor = #6e6e73

#---- Lists, tables and trees ----

List.selectionBackground = #0071e3
List.selectionForeground = #ffffff
List.selectionInactiveBackground = #e3e3e8
List.selectionInactiveForeground = #1d1d1f
Table.selectionBackground = #e1edfd
Table.selectionForeground = #1d1d1f
Table.selectionInactiveBackground = #ececf0
Table.gridColor = #ececf0
TableHeader.background = #f5f5f7
TableHeader.separatorColor = #e3e3e8
TableHeader.bottomSeparatorColor = #e3e3e8
Tree.selectionBackground = #0071e3
Tree.selectionForeground = #ffffff

#---- Tabs: a segmented control, the selected tab a raised pill ----

TabbedPane.tabHeight = 32
TabbedPane.tabInsets = 4,14,4,14
TabbedPane.tabAreaInsets = 4,8,4,8
TabbedPane.tabSelectionHeight = 32
TabbedPane.tabSelectionInsets = 3,2,3,2
TabbedPane.tabSelectionArc = 8
TabbedPane.tabArc = 8
TabbedPane.underlineColor = #ffffff
TabbedPane.inactiveUnderlineColor = #ececf0
TabbedPane.selectedForeground = #1d1d1f
TabbedPane.foreground = #6e6e73
TabbedPane.hoverColor = #ececf0
TabbedPane.focusColor = #f5f5f7
TabbedPane.contentAreaColor = #e3e3e8
