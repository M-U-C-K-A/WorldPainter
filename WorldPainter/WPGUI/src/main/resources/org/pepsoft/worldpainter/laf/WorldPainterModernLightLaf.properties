#---- Menus, popups and tooltips ----

MenuBar.borderColor = #e3e3e8
PopupMenu.background = #ffffff
PopupMenu.borderColor = #d9d9de
PopupMenu.borderCornerRadius = 12
Popup.borderCornerRadius = 12
MenuItem.background = #ffffff
