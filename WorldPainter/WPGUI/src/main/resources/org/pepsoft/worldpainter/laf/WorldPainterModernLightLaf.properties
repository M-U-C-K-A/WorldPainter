#==== Modern ====

# WorldPainter Modern, light: a window of soft grey with raised white surfaces, a blue accent, softly rounded
# controls, and selections filled with the accent. Builds on WorldPainterLightLaf.properties (Classic), of which it
# overrides the colours and shapes.
#
# Neutrals: #ffffff surface, #f5f5f7 window, #ececf0 fill, #e3e3e8 hairline, #d9d9de border, #c7c7cc strong border,
# #aeaeb2 disabled, #6e6e73 secondary text, #1d1d1f text. Accent: #0071e3, pressed #0062c4, tint #e1edfd.

#---- Base ----

@background = #f5f5f7
@foreground = #1d1d1f
@accentColor = #0071e3
@disabledForeground = #aeaeb2
@selectionBackground = #0071e3
