# WorldPainter Tactile, light: the layout of the Modern theme (from which it inherits) with controls you feel you could
# touch. Buttons stand half out of the window, lit from above with a darker lip along their bottom edge, the default
# button in a warm orange; sliders sink into wide grooves with their ticks inside; selected tools stand out as white
# tiles; the map lies on a grid of fine lines. The buttons and sliders are painted by TactileButtonUI,
# TactileToggleButtonUI and TactileSliderUI, from the Tactile.* colours below.
#
# Neutrals: #ffffff tile, #f6f6f6 field, #efefef window, #e4e4e4 groove, #d6d6d6 border, #a3a3a3 disabled,
# #7a7a7a secondary text, #262626 text. Accent: orange #ea6a2a, light #fde3d3.

#---- Base ----

@background = #efefef
@foreground = #262626
@accentColor = #ea6a2a
@disabledForeground = #a3a3a3
@selectionBackground = #ea6a2a
@selectionForeground = #ffffff
@selectionInactiveBackground = #e4e4e4

ButtonUI = org.pepsoft.worldpainter.laf.TactileButtonUI
ToggleButtonUI = org.pepsoft.worldpainter.laf.TactileToggleButtonUI
SliderUI = org.pepsoft.worldpainter.laf.TactileSliderUI
CheckBox.icon = org.pepsoft.worldpainter.laf.TactileCheckBoxIcon
RadioButton.icon = org.pepsoft.worldpainter.laf.TactileCheckBoxIcon$Round

Component.arc = 12
Button.arc = 14
TextComponent.arc = 10
CheckBox.arc = 6
Component.borderColor = #d6d6d6
Component.disabledBorderColor = #e4e4e4
Component.focusedBorderColor = #ea6a2a
Component.focusColor = #ea6a2a40
Component.accentColor = #ea6a2a
Component.linkColor = #c4521a

Panel.background = #efefef
Label.disabledForeground = #a3a3a3
Separator.foreground = #dcdcdc
TitledBorder.titleColor = #7a7a7a

#---- Buttons (painted by TactileButtonUI) ----

Button.borderWidth = 0
Button.default.borderWidth = 0
Button.default.foreground = #ffffff
Button.default.boldText = true
Button.margin = 4,14,7,14
Button.toolbar.margin = 5,5,7,5
ToggleButton.selectedForeground = #262626

Tactile.button.top = #ffffff
Tactile.button.bottom = #ededed
Tactile.button.lip = #c9c9c9
Tactile.button.border = #d2d2d2
Tactile.default.top = #f5934f
Tactile.default.bottom = #e3632a
Tactile.default.lip = #b4461a
Tactile.default.border = #c9531e
Tactile.selected.top = #fde9dc
Tactile.selected.bottom = #fbd5bd
Tactile.selected.lip = #e7a983
Tactile.selected.border = #eaa07a
Tactile.raised.top = #ffffff
Tactile.raised.bottom = #f4f4f4
Tactile.raised.lip = #d0d0d0
Tactile.raised.border = #cfcfcf
Tactile.thumb.top = #ffffff
Tactile.thumb.bottom = #ececec
Tactile.thumb.lip = #c4c4c4
Tactile.thumb.border = #c7c7c7
Tactile.toolbar.hover = #00000012
Tactile.toolbar.pressed = #00000022
Tactile.shadow = #00000030
Tactile.highlight = #ffffffcc
Tactile.sunken.fill = #e6e6e6
Tactile.sunken.shade = #00000024
Tactile.sunken.border = #d3d3d3
# The lights, by the kind of tool: sculpting, painting, water, selection
Tactile.led.sculpt = #ff6a1a
Tactile.led.paint = #2f7cf6
Tactile.led.water = #12b5c9
Tactile.led.select = #9b5cf6
Tactile.led.off = #b8b8b8
Tactile.tick = #b3b3b3

CheckBox.icon.borderColor = #c4c4c4
CheckBox.icon.selectedBorderColor = #c9531e
CheckBox.icon.selectedBackground = #ea6a2a
CheckBox.icon.checkmarkColor = #ffffff
CheckBox.icon.focusedBorderColor = #ea6a2a
CheckBox.icon.hoverBorderColor = #a3a3a3

#---- Text fields, combo boxes and spinners ----

TextField.background = #f8f8f8
FormattedTextField.background = #f8f8f8
ComboBox.background = #ffffff
Spinner.background = #f8f8f8
TextComponent.selectionBackground = #f8c6a6
ComboBox.selectionBackground = #ea6a2a
ComboBox.selectionForeground = #ffffff

#---- Lists, tables and trees ----

List.selectionBackground = #fde3d3
List.selectionForeground = #262626
List.selectionInactiveBackground = #ececec
Table.selectionBackground = #fde3d3
Table.selectionForeground = #262626
Tree.selectionBackground = #fde3d3
Tree.selectionForeground = #262626

#---- Tabs, menus, tooltips ----

TabbedPane.underlineColor = #ea6a2a
MenuItem.selectionBackground = #ea6a2a
MenuItem.selectionForeground = #ffffff
Menu.selectionBackground = #ea6a2a
Menu.selectionForeground = #ffffff
CheckBoxMenuItem.selectionBackground = #ea6a2a
RadioButtonMenuItem.selectionBackground = #ea6a2a
ToolTip.background = #262626
ToolTip.foreground = #fafafa

#---- Sliders, progress bars (sliders painted by TactileSliderUI) ----

Slider.thumbSize = 14,26
Slider.trackValueColor = #ea6a2a
Slider.focusedColor = #ea6a2a40
ProgressBar.foreground = #ea6a2a
ProgressBar.background = #e4e4e4

#---- WorldPainter specific ----

WorldPainter.tactile = true
WorldPainter.canvasGrid = true
WorldPainter.canvasGridMajor = #cfcfcf
WorldPainter.canvasBackground = #f4f4f4
WorldPainter.canvasGridLine = #e2e2e2
WorldPainter.canvasDot = #c4c4c4
WorldPainter.surface = #ffffff
WorldPainter.surfaceBorder = #e2e2e2
WorldPainter.sidebarBackground = #efefef
WorldPainter.border = #dcdcdc
WorldPainter.mutedForeground = #7a7a7a
WorldPainter.accent = #ea6a2a
WorldPainter.rowHover = #e8e8e8
WorldPainter.rowSelected = #fde3d3
WorldPainter.node.output = #ea6a2a
