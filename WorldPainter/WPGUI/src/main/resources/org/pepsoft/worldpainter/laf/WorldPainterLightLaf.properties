# WorldPainter Classic, light: the look of a classic desktop application, as WorldPainter used to have. A grey window,
# square controls with clear borders, buttons with a slight gradient, scroll bars with arrows, card shaped tabs, yellow
# tooltips, a steel blue selection, the font of the system and the original icons of WorldPainter.
#
# Greys: #ffffff field, #f4f4f4 raised, #e9e9e9 window, #dcdcdc pressed, #c8c8c8 disabled border, #9c9c9c border,
# #5a5a5a secondary text, #1a1a1a text. Accent: steel blue #3a6ea5, light #c9d9ee.

#---- Base ----

@background = #e9e9e9
@foreground = #1a1a1a
@accentColor = #3a6ea5
@disabledForeground = #9a9a9a
@selectionBackground = #3a6ea5
@selectionForeground = #ffffff
@selectionInactiveBackground = #c8d3e0

Component.arc = 2
Button.arc = 3
TextComponent.arc = 0
CheckBox.arc = 1
ProgressBar.arc = 0
Component.borderColor = #9c9c9c
Component.disabledBorderColor = #c8c8c8
Component.focusedBorderColor = #3a6ea5
Component.focusColor = #3a6ea5
Component.innerFocusWidth = 0
Component.focusWidth = 1
Component.accentColor = #3a6ea5
Component.linkColor = #1f4f9a

Panel.background = #e9e9e9
Label.disabledForeground = #9a9a9a
Separator.foreground = #b5b5b5
TitledBorder.titleColor = #1a1a1a

#---- Buttons ----

Button.background = #ececec
Button.startBackground = #fbfbfb
Button.endBackground = #dddddd
Button.borderColor = #9c9c9c
Button.hoverBackground = #eef3f9
Button.hoverBorderColor = #3a6ea5
Button.pressedBackground = #d3dbe6
Button.focusedBorderColor = #3a6ea5
Button.disabledBorderColor = #c8c8c8
Button.default.background = #3a6ea5
Button.default.startBackground = #6593c9
Button.default.endBackground = #3a6ea5
Button.default.foreground = #ffffff
Button.default.borderColor = #2c5684
Button.default.hoverBackground = #4a7db4
Button.default.pressedBackground = #2f5d8f
Button.default.focusedBorderColor = #2c5684
Button.default.focusedBackground = #3a6ea5
Button.default.hoverBorderColor = #2c5684
Button.default.boldText = true
Button.toolbar.hoverBackground = #dbe4ef
Button.toolbar.pressedBackground = #c6d3e3
Button.toolbar.selectedBackground = #c9d9ee
Button.toolbar.margin = 3,3,3,3
Button.toolbar.spacingInsets = 1,1,1,1
ToggleButton.selectedBackground = #c9d9ee
ToggleButton.selectedForeground = #12355c
ToggleButton.toolbar.selectedBackground = #c9d9ee
ToggleButton.toolbar.hoverBackground = #dbe4ef

CheckBox.icon.borderColor = #8a8a8a
CheckBox.icon.background = #ffffff
CheckBox.icon.selectedBorderColor = #2c5684
CheckBox.icon.selectedBackground = #3a6ea5
CheckBox.icon.checkmarkColor = #ffffff
CheckBox.icon.focusedBorderColor = #3a6ea5
CheckBox.icon.hoverBorderColor = #3a6ea5

#---- Text fields, combo boxes and spinners ----

TextField.background = #ffffff
FormattedTextField.background = #ffffff
TextComponent.selectionBackground = #3a6ea5
TextComponent.selectionForeground = #ffffff
ComboBox.background = #ffffff
ComboBox.buttonStyle = button
ComboBox.buttonBackground = #e4e4e4
ComboBox.buttonEditableBackground = #e4e4e4
ComboBox.buttonArrowColor = #3c3c3c
ComboBox.selectionBackground = #3a6ea5
ComboBox.selectionForeground = #ffffff
Spinner.background = #ffffff
Spinner.buttonStyle = button
Spinner.buttonBackground = #e4e4e4
Spinner.buttonArrowColor = #3c3c3c

#---- Lists, tables and trees ----

List.selectionBackground = #3a6ea5
List.selectionForeground = #ffffff
List.selectionInactiveBackground = #c8d3e0
Table.selectionBackground = #3a6ea5
Table.selectionForeground = #ffffff
Table.selectionInactiveBackground = #c8d3e0
Table.gridColor = #d6d6d6
Table.showHorizontalLines = true
Table.showVerticalLines = true
TableHeader.background = #e4e4e4
TableHeader.separatorColor = #b5b5b5
TableHeader.bottomSeparatorColor = #9c9c9c
Tree.selectionBackground = #3a6ea5
Tree.selectionForeground = #ffffff

#---- Tabs ----

TabbedPane.tabType = card
TabbedPane.tabHeight = 26
TabbedPane.selectedBackground = #f7f7f7
TabbedPane.underlineColor = #3a6ea5
TabbedPane.inactiveUnderlineColor = #9c9c9c
