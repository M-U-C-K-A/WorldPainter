# WorldPainter light theme: shadcn/ui inspired zinc palette with an orange accent.
#
# zinc-50 #fafafa, zinc-100 #f4f4f5, zinc-200 #e4e4e7, zinc-300 #d4d4d8, zinc-400 #a1a1aa, zinc-500 #71717a,
# zinc-600 #52525b, zinc-700 #3f3f46, zinc-800 #27272a, zinc-900 #18181b, zinc-950 #09090b

#---- Base ----

@background = #ffffff
@foreground = #09090b
@accentColor = #f97316
@disabledForeground = #a1a1aa
@selectionBackground = #fed7aa
@selectionForeground = #09090b
@selectionInactiveBackground = #f4f4f5

Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
CheckBox.arc = 5
ProgressBar.arc = 8
Component.borderColor = #e4e4e7
Component.disabledBorderColor = #f4f4f5
Component.focusedBorderColor = #a1a1aa
Component.focusColor = #f9731640
Component.innerFocusWidth = 0
Component.focusWidth = 2
Component.accentColor = #f97316

Panel.background = #ffffff
Label.disabledForeground = #a1a1aa
Separator.foreground = #e4e4e7
TitledBorder.titleColor = #71717a

#---- Buttons ----

Button.background = #ffffff
Button.borderColor = #e4e4e7
Button.hoverBackground = #f4f4f5
Button.pressedBackground = #e4e4e7
Button.focusedBorderColor = #a1a1aa
Button.disabledBorderColor = #f4f4f5
Button.default.background = #18181b
Button.default.foreground = #fafafa
Button.default.borderColor = #18181b
Button.default.hoverBackground = #27272a
Button.default.pressedBackground = #3f3f46
Button.default.focusedBorderColor = #18181b
Button.default.boldText = false
Button.toolbar.hoverBackground = #f4f4f5
Button.toolbar.pressedBackground = #e4e4e7
Button.toolbar.selectedBackground = #ffedd5
Button.toolbar.margin = 4,4,4,4
Button.toolbar.spacingInsets = 1,1,1,1
ToggleButton.selectedBackground = #ffedd5
ToggleButton.selectedForeground = #9a3412
ToggleButton.toolbar.selectedBackground = #ffedd5
ToggleButton.toolbar.hoverBackground = #f4f4f5

CheckBox.icon.borderColor = #d4d4d8
CheckBox.icon.selectedBorderColor = #18181b
CheckBox.icon.selectedBackground = #18181b
CheckBox.icon.checkmarkColor = #fafafa
CheckBox.icon.focusedBorderColor = #a1a1aa
CheckBox.icon.hoverBorderColor = #a1a1aa

#---- Text fields, combo boxes and spinners ----

TextField.background = #ffffff
TextComponent.selectionBackground = #fed7aa
ComboBox.buttonStyle = none
ComboBox.buttonArrowColor = #71717a
ComboBox.selectionBackground = #f4f4f5
ComboBox.selectionForeground = #09090b
Spinner.buttonStyle = none
Spinner.buttonArrowColor = #71717a

#---- Lists, tables and trees ----

List.selectionBackground = #f4f4f5
List.selectionForeground = #09090b
List.selectionInactiveBackground = #f4f4f5
Table.selectionBackground = #fff7ed
Table.selectionForeground = #09090b
Table.selectionInactiveBackground = #f4f4f5
Table.gridColor = #f4f4f5
Table.showHorizontalLines = true
TableHeader.background = #fafafa
TableHeader.separatorColor = #e4e4e7
TableHeader.bottomSeparatorColor = #e4e4e7
Tree.selectionBackground = #f4f4f5
Tree.selectionForeground = #09090b

#---- Tabs ----

TabbedPane.underlineColor = #f97316
TabbedPane.inactiveUnderlineColor = #a1a1aa
TabbedPane.hoverColor = #f4f4f5
TabbedPane.focusColor = #ffffff
TabbedPane.contentAreaColor = #e4e4e7
TabbedPane.tabHeight = 30
TabbedPane.tabSeparatorColor = #e4e4e7
TabbedPane.showTabSeparators = false

#---- Menus, popups and tooltips ----

MenuBar.borderColor = #e4e4e7
PopupMenu.borderColor = #e4e4e7
PopupMenu.borderCornerRadius = 10
Popup.borderCornerRadius = 10
MenuItem.selectionBackground = #f4f4f5
MenuItem.selectionForeground = #09090b
MenuItem.selectionArc = 6
MenuItem.selectionInsets = 0,4,0,4
Menu.selectionBackground = #f4f4f5
Menu.selectionForeground = #09090b
CheckBoxMenuItem.selectionBackground = #f4f4f5
RadioButtonMenuItem.selectionBackground = #f4f4f5
ToolTip.background = #18181b
ToolTip.foreground = #fafafa
ToolTip.border = 6,10,6,10

#---- Scroll bars, sliders, progress bars ----

ScrollBar.width = 10
ScrollBar.showButtons = false
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.track = #00000000
ScrollBar.thumb = #d4d4d8
ScrollBar.hoverThumbColor = #a1a1aa
ScrollBar.pressedThumbColor = #71717a
Slider.trackWidth = 4
Slider.thumbSize = 14,14
Slider.trackColor = #e4e4e7
Slider.trackValueColor = #18181b
Slider.thumbColor = #ffffff
Slider.thumbBorderColor = #18181b
Slider.hoverThumbColor = #fafafa
Slider.focusedColor = #f9731640
ProgressBar.foreground = #18181b
ProgressBar.background = #f4f4f5

#---- Tool bars, title bar, split panes ----

ToolBar.background = #ffffff
ToolBar.separatorColor = #e4e4e7
ToolBar.separatorWidth = 9
TitlePane.background = #ffffff
TitlePane.unifiedBackground = true
SplitPaneDivider.style = plain

#---- WorldPainter specific ----

WorldPainter.canvasBackground = #f4f4f5
WorldPainter.canvasDot = #d4d4d8
WorldPainter.sidebarBackground = #fafafa
WorldPainter.border = #e4e4e7
WorldPainter.mutedForeground = #71717a
WorldPainter.accent = #f97316
WorldPainter.rowHover = #f4f4f5
WorldPainter.rowSelected = #fff7ed

# Node graph editor
WorldPainter.node.background = #ffffff
WorldPainter.node.border = #e4e4e7
WorldPainter.node.shadow = #18181b14
WorldPainter.node.wire = #a1a1aa
WorldPainter.node.generator = #0ea5e9
WorldPainter.node.combiner = #8b5cf6
WorldPainter.node.filter = #14b8a6
WorldPainter.node.output = #f97316
