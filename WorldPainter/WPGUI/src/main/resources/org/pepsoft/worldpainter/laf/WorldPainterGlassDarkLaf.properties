TabbedPane.focusColor = #00000000
TabbedPane.contentAreaColor = #00000000
TabbedPane.tabsOpaque = false

#---- Menus, popups and tooltips ----

MenuBar.borderColor = #30353a
PopupMenu.background = #24282c
PopupMenu.borderColor = #3a4045
PopupMenu.borderCornerRadius = 16
Popup.borderCornerRadius = 16
MenuItem.background = #24282c
Menu.background = #24282c
MenuItem.selectionBackground = #343a3f
MenuItem.selectionForeground = #eef0f2
