Slider.hoverThumbColor = #ffffff
Slider.focusedColor = #ffffff26
ProgressBar.foreground = #f2f4f5
ProgressBar.background = #30353a

#---- Tool bars, title bar, split panes ----

ToolBar.background = #16191c
ToolBar.separatorColor = #3a4045
TitlePane.background = #171c1d

#---- WorldPainter specific ----

WorldPainter.glass = true
WorldPainter.surface = #24282c
WorldPainter.surfaceBorder = #30353a
WorldPainter.canvasBackground = #121417
WorldPainter.canvasDot = #2b3034
WorldPainter.sidebarBackground = #16191c
WorldPainter.border = #30353a
WorldPainter.mutedForeground = #9aa1a8
WorldPainter.icon = #d4d8dc
WorldPainter.warning = #ff9f0a
WorldPainter.accent = #f2f4f5
WorldPainter.rowHover = #ffffff0f
WorldPainter.rowSelected = #ffffff1a

# The smoked glass: the gradient behind the windows, the light in its corner, and the translucent cards on it
WorldPainter.glass.backdropTop = #172022
WorldPainter.glass.backdropBottom = #131518
WorldPainter.glass.glow = #1a2f2c
WorldPainter.glass.glow2 = #24203a
WorldPainter.glass.surface = #ffffff0d
WorldPainter.glass.surfaceTop = #ffffff17
WorldPainter.glass.edge = #ffffff24
WorldPainter.glass.edgeBottom = #ffffff0a
WorldPainter.glass.shadow = #000000

# Node graph editor
WorldPainter.node.background = #24282c
WorldPainter.node.border = #3a4045
WorldPainter.node.shadow = #00000066
WorldPainter.node.wire = #646b71
WorldPainter.node.output = #f2f4f5

#==== Liquid Glass ====
# After the Liquid Glass of Apple: the settings above are the earlier frosted design; these override them. Buttons,
# toggle buttons, sliders and check boxes are painted by GlassButtonUI, GlassToggleButtonUI, GlassSliderUI and
# GlassSwitchIcon, and the panes of glass by Glass.paintLiquid(), from the WorldPainter.glass.* colours below.

ButtonUI = org.pepsoft.worldpainter.laf.GlassButtonUI
ToggleButtonUI = org.pepsoft.worldpainter.laf.GlassToggleButtonUI
SliderUI = org.pepsoft.worldpainter.laf.GlassSliderUI
CheckBox.icon = org.pepsoft.worldpainter.laf.GlassSwitchIcon
CheckBox.iconTextGap = 3

Button.borderWidth = 0
Button.default.borderWidth = 0
Button.default.foreground = #ffffff
Button.default.boldText = true
Button.margin = 5,18,5,18
Slider.thumbSize = 34,22

@accentColor = #0a84ff
@selectionBackground = #0a84ff
@selectionForeground = #ffffff
