# WorldPainter Glass, dark: smoked glass over a deep gradient of slate and teal, translucent cards with large rounded
# corners, pill shaped buttons and tabs, and white as the accent. Builds on WorldPainterModernDarkLaf.properties
# (Modern), of which it overrides the colours and shapes.
#
# Neutrals: #24282c surface, #16191c window, #2b3034 fill, #30353a hairline, #3a4045 border, #4b5258 strong border,
# #646b71 disabled, #9aa1a8 secondary text, #eef0f2 text. Accent: #f2f4f5, hover #ffffff, tint #ffffff14.

#---- Base ----

@background = #16191c
@foreground = #eef0f2
@accentColor = #f2f4f5
@disabledForeground = #646b71
@selectionBackground = #f2f4f5
@selectionForeground = #121417
@selectionInactiveBackground = #30353a

Component.arc = 14
Button.arc = 999
TextComponent.arc = 14
CheckBox.arc = 6
Component.borderColor = #3a4045
Component.disabledBorderColor = #30353a
Component.focusedBorderColor = #f2f4f5
Component.focusColor = #ffffff26
Component.accentColor = #f2f4f5
Component.linkColor = #8fb0ff

Panel.background = #16191c
Label.disabledForeground = #646b71
Separator.foreground = #ffffff12
TitledBorder.titleColor = #9aa1a8

#---- Buttons: pills, the default one white ----

Button.background = #2b3034
Button.borderColor = #3a4045
Button.hoverBackground = #31373c
Button.pressedBackground = #24282c
Button.focusedBorderColor = #f2f4f5
Button.disabledBorderColor = #30353a
Button.margin = 4,16,4,16
Button.default.background = #f2f4f5
Button.default.foreground = #121417
Button.default.borderColor = #f2f4f5
Button.default.hoverBackground = #ffffff
Button.default.pressedBackground = #d9dde0
Button.default.focusedBorderColor = #f2f4f5
Button.default.focusedBackground = #f2f4f5
Button.default.hoverBorderColor = #ffffff
Button.toolbar.hoverBackground = #ffffff14
Button.toolbar.pressedBackground = #ffffff1f
Button.toolbar.selectedBackground = #ffffff1f
Button.toolbar.arc = 12
ToggleButton.selectedBackground = #f2f4f5
ToggleButton.selectedForeground = #121417
ToggleButton.toolbar.selectedBackground = #ffffff1f
ToggleButton.toolbar.hoverBackground = #ffffff14

CheckBox.icon.background = #24282c
CheckBox.icon.borderColor = #4b5258
CheckBox.icon.selectedBorderColor = #f2f4f5
CheckBox.icon.selectedBackground = #f2f4f5
CheckBox.icon.checkmarkColor = #121417
CheckBox.icon.focusedBorderColor = #f2f4f5
CheckBox.icon.hoverBorderColor = #646b71

#---- Text fields, combo boxes and spinners ----

TextField.background = #24282c
FormattedTextField.background = #24282c
ComboBox.background = #24282c
Spinner.background = #24282c
TextComponent.selectionBackground = #4b5562
ComboBox.buttonArrowColor = #9aa1a8
ComboBox.selectionBackground = #30353a
ComboBox.selectionForeground = #eef0f2
Spinner.buttonArrowColor = #9aa1a8

#---- Lists, tables and trees: soft selections ----

List.background = #1d2124
List.selectionBackground = #343a3f
List.selectionForeground = #eef0f2
List.selectionInactiveBackground = #2b3034
List.selectionInactiveForeground = #eef0f2
Table.background = #1d2124
Table.selectionBackground = #343a3f
Table.selectionForeground = #eef0f2
Table.selectionInactiveBackground = #2b3034
Table.gridColor = #2b3034
TableHeader.background = #1d2124
TableHeader.separatorColor = #30353a
TableHeader.bottomSeparatorColor = #30353a
Tree.background = #1d2124
Tree.selectionBackground = #343a3f
Tree.selectionForeground = #eef0f2

#---- Tabs: chips, the selected one a white pill ----

TabbedPane.tabHeight = 32
TabbedPane.tabInsets = 4,16,4,16
TabbedPane.tabAreaInsets = 6,10,6,10
TabbedPane.tabSelectionHeight = 32
TabbedPane.tabSelectionInsets = 2,3,2,3
TabbedPane.tabSelectionArc = 999
TabbedPane.tabArc = 999
TabbedPane.underlineColor = #f2f4f5
TabbedPane.inactiveUnderlineColor = #f2f4f5
