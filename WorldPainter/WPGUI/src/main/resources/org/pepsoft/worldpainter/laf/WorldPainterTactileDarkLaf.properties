# WorldPainter Tactile, dark: the layout of the Modern theme (from which it inherits) with controls you feel you could
# touch, on graphite. Buttons stand half out of the window, lit from above with a darker lip along their bottom edge,
# the default button in a warm orange; sliders sink into wide grooves with their ticks inside; selected tools stand
# out as tiles; the map lies on a grid of fine lines. See WorldPainterTactileLightLaf.properties.
#
# Neutrals: #4a4a50 tile, #3a3a3f field, #2b2b2f window, #222226 groove, #4a4a50 border, #6e6e74 disabled,
# #a0a0a6 secondary text, #ececec text. Accent: orange #f07a3a.

#---- Base ----

@background = #2b2b2f
@foreground = #ececec
@accentColor = #f07a3a
@disabledForeground = #6e6e74
@selectionBackground = #f07a3a
@selectionForeground = #ffffff
@selectionInactiveBackground = #3a3a3f

ButtonUI = org.pepsoft.worldpainter.laf.TactileButtonUI
ToggleButtonUI = org.pepsoft.worldpainter.laf.TactileToggleButtonUI
SliderUI = org.pepsoft.worldpainter.laf.TactileSliderUI

Component.arc = 12
Button.arc = 14
TextComponent.arc = 10
CheckBox.arc = 6
Component.borderColor = #45454b
Component.disabledBorderColor = #37373c
Component.focusedBorderColor = #f07a3a
Component.focusColor = #f07a3a55
Component.accentColor = #f07a3a
Component.linkColor = #f59a63

Panel.background = #2b2b2f
Label.disabledForeground = #6e6e74
Separator.foreground = #3d3d42
TitledBorder.titleColor = #a0a0a6

#---- Buttons (painted by TactileButtonUI) ----

Button.borderWidth = 0
Button.default.borderWidth = 0
Button.default.foreground = #ffffff
Button.default.boldText = true
Button.margin = 4,14,6,14
Button.toolbar.margin = 5,5,5,5
ToggleButton.selectedForeground = #ffffff

Tactile.button.top = #4f4f56
Tactile.button.bottom = #414147
Tactile.button.lip = #2a2a2e
Tactile.button.border = #2f2f34
Tactile.default.top = #f7944f
Tactile.default.bottom = #e3632a
Tactile.default.lip = #9a3a14
Tactile.default.border = #b84c1c
Tactile.selected.top = #6a4636
Tactile.selected.bottom = #5a3a2c
Tactile.selected.lip = #3a241a
Tactile.selected.border = #7a4a33
Tactile.raised.top = #55555c
Tactile.raised.bottom = #47474d
Tactile.raised.lip = #26262a
Tactile.raised.border = #2f2f34
Tactile.thumb.top = #6a6a72
Tactile.thumb.bottom = #55555c
Tactile.thumb.lip = #2a2a2e
Tactile.thumb.border = #2a2a2e
Tactile.toolbar.hover = #ffffff14
Tactile.toolbar.pressed = #ffffff22
Tactile.shadow = #00000070
Tactile.highlight = #ffffff2e
Tactile.sunken.fill = #222226
Tactile.sunken.shade = #00000066
Tactile.sunken.border = #1c1c1f
Tactile.tick = #5c5c63

CheckBox.icon.borderColor = #5c5c63
CheckBox.icon.selectedBorderColor = #b84c1c
CheckBox.icon.selectedBackground = #f07a3a
CheckBox.icon.checkmarkColor = #ffffff
CheckBox.icon.focusedBorderColor = #f07a3a
CheckBox.icon.hoverBorderColor = #7a7a80

#---- Text fields, combo boxes and spinners ----

TextField.background = #35353a
FormattedTextField.background = #35353a
ComboBox.background = #3a3a3f
Spinner.background = #35353a
TextComponent.selectionBackground = #8a4a28
ComboBox.selectionBackground = #f07a3a
ComboBox.selectionForeground = #ffffff

#---- Lists, tables and trees ----

List.selectionBackground = #5a3a2c
List.selectionForeground = #ffffff
List.selectionInactiveBackground = #3a3a3f
Table.selectionBackground = #5a3a2c
Table.selectionForeground = #ffffff
Tree.selectionBackground = #5a3a2c
Tree.selectionForeground = #ffffff

#---- Tabs, menus, tooltips ----

TabbedPane.underlineColor = #f07a3a
MenuItem.selectionBackground = #f07a3a
MenuItem.selectionForeground = #ffffff
Menu.selectionBackground = #f07a3a
Menu.selectionForeground = #ffffff
CheckBoxMenuItem.selectionBackground = #f07a3a
RadioButtonMenuItem.selectionBackground = #f07a3a
ToolTip.background = #ececec
ToolTip.foreground = #1c1c1f

#---- Sliders, progress bars (sliders painted by TactileSliderUI) ----

Slider.thumbSize = 14,26
Slider.trackValueColor = #f07a3a
Slider.focusedColor = #f07a3a55
ProgressBar.foreground = #f07a3a
ProgressBar.background = #222226

#---- WorldPainter specific ----

WorldPainter.tactile = true
WorldPainter.canvasGrid = true
WorldPainter.canvasBackground = #242428
WorldPainter.canvasGridLine = #303035
WorldPainter.canvasDot = #46464c
WorldPainter.surface = #35353a
WorldPainter.surfaceBorder = #404046
WorldPainter.sidebarBackground = #2b2b2f
WorldPainter.border = #3d3d42
WorldPainter.mutedForeground = #a0a0a6
WorldPainter.accent = #f07a3a
WorldPainter.rowHover = #36363b
WorldPainter.rowSelected = #5a3a2c
WorldPainter.node.output = #f07a3a
