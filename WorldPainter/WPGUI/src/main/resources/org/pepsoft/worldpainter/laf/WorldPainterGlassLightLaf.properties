ComboBox.background = #ffffff
Spinner.background = #ffffff
TextComponent.selectionBackground = #d5dde0
ComboBox.buttonArrowColor = #6b7177
ComboBox.selectionBackground = #eef1f1
ComboBox.selectionForeground = #121417
Spinner.buttonArrowColor = #6b7177

#---- Lists, tables and trees: soft grey selections ----

List.selectionBackground = #e6eaeb
List.selectionForeground = #121417
List.selectionInactiveBackground = #eef1f1
