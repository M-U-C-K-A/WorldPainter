# WorldPainter Glass, light: frosted glass over a soft gradient of sage and pearl grey, translucent white cards with
# large rounded corners, pill shaped buttons and tabs, and black as the accent. Builds on
# WorldPainterModernLightLaf.properties (Modern), of which it overrides the colours and shapes.
#
# Neutrals: #ffffff surface, #eef1f1 window, #e9eded fill, #e3e7e8 hairline, #dce0e2 border, #c6ccd0 strong border,
# #a9b0b5 disabled, #6b7177 secondary text, #121417 text. Accent: #121417, hover #2a2e33, tint #12141714.

#---- Base ----

@background = #eef1f1
@foreground = #121417
@accentColor = #121417
@disabledForeground = #a9b0b5
@selectionBackground = #121417
@selectionForeground = #ffffff
@selectionInactiveBackground = #e3e7e8

Component.arc = 14
Button.arc = 999
TextComponent.arc = 14
CheckBox.arc = 6
Component.borderColor = #dce0e2
Component.disabledBorderColor = #e3e7e8
Component.focusedBorderColor = #121417
Component.focusColor = #12141722
Component.accentColor = #121417
Component.linkColor = #2f5bd3

Panel.background = #eef1f1
Label.disabledForeground = #a9b0b5
Separator.foreground = #e7eaeb
TitledBorder.titleColor = #6b7177

#---- Buttons: pills, the default one black ----

Button.background = #ffffff
Button.borderColor = #dce0e2
Button.hoverBackground = #f7f8f8
Button.pressedBackground = #e9eded
Button.focusedBorderColor = #121417
Button.disabledBorderColor = #e3e7e8
Button.margin = 4,16,4,16
Button.default.background = #121417
Button.default.foreground = #ffffff
Button.default.borderColor = #121417
Button.default.hoverBackground = #2a2e33
Button.default.pressedBackground = #000000
Button.default.focusedBorderColor = #121417
Button.default.focusedBackground = #121417
Button.default.hoverBorderColor = #2a2e33
Button.toolbar.hoverBackground = #ffffffb3
Button.toolbar.pressedBackground = #e3e7e8
Button.toolbar.selectedBackground = #ffffff
Button.toolbar.arc = 12
ToggleButton.selectedBackground = #121417
ToggleButton.selectedForeground = #ffffff
ToggleButton.toolbar.selectedBackground = #ffffff
ToggleButton.toolbar.hoverBackground = #ffffffb3

CheckBox.icon.borderColor = #c6ccd0
CheckBox.icon.selectedBorderColor = #121417
CheckBox.icon.selectedBackground = #121417
CheckBox.icon.checkmarkColor = #ffffff
CheckBox.icon.focusedBorderColor = #121417
CheckBox.icon.hoverBorderColor = #a9b0b5

#---- Text fields, combo boxes and spinners ----

TextField.background = #ffffff
