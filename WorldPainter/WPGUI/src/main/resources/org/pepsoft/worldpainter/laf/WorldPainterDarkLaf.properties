# WorldPainter Classic, dark: the look of a classic dark desktop application, in the spirit of Darcula. A charcoal
# window, square controls with clear borders, buttons with a slight gradient, scroll bars with arrows, card shaped tabs,
# a slate blue selection, the font of the system and the original icons of WorldPainter.
#
# Greys: #2b2b2b canvas, #3c3f41 window, #45494a field, #4c5052 raised, #5e6264 border, #808080 disabled,
# #a9b0b6 secondary text, #bbbbbb text. Accent: #4b6eaf, focus #3d6185.

#---- Base ----

@background = #3c3f41
@foreground = #bbbbbb
@accentColor = #4b6eaf
@disabledForeground = #808080
@selectionBackground = #4b6eaf
@selectionForeground = #ffffff
@selectionInactiveBackground = #0d293e

Component.arc = 2
Button.arc = 3
TextComponent.arc = 0
CheckBox.arc = 1
ProgressBar.arc = 0
Component.borderColor = #5e6264
Component.disabledBorderColor = #4a4d4f
Component.focusedBorderColor = #466d94
Component.focusColor = #3d6185
Component.innerFocusWidth = 0
Component.focusWidth = 1
Component.accentColor = #4b6eaf
Component.linkColor = #589df6

Panel.background = #3c3f41
Label.disabledForeground = #808080
Separator.foreground = #515658
TitledBorder.titleColor = #bbbbbb

#---- Buttons ----

Button.background = #4c5052
Button.startBackground = #55595c
Button.endBackground = #45494b
Button.borderColor = #5e6264
Button.hoverBackground = #53585b
Button.hoverBorderColor = #6e7375
Button.pressedBackground = #3e4244
Button.focusedBorderColor = #466d94
Button.disabledBorderColor = #4a4d4f
Button.default.background = #365880
Button.default.startBackground = #3f6593
Button.default.endBackground = #314f75
Button.default.foreground = #ffffff
Button.default.borderColor = #4c708c
Button.default.hoverBackground = #3d6189
Button.default.pressedBackground = #2c4868
Button.default.focusedBorderColor = #537699
Button.default.focusedBackground = #365880
Button.default.hoverBorderColor = #5c7f9e
Button.default.boldText = true
Button.toolbar.hoverBackground = #4c5052
Button.toolbar.pressedBackground = #5c6164
Button.toolbar.selectedBackground = #2f4d6e
Button.toolbar.margin = 3,3,3,3
Button.toolbar.spacingInsets = 1,1,1,1
ToggleButton.selectedBackground = #2f4d6e
