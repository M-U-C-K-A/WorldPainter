# WorldPainter dark theme: shadcn/ui inspired zinc palette with an orange accent.
#
# zinc-50 #fafafa, zinc-100 #f4f4f5, zinc-200 #e4e4e7, zinc-300 #d4d4d8, zinc-400 #a1a1aa, zinc-500 #71717a,
# zinc-600 #52525b, zinc-700 #3f3f46, zinc-800 #27272a, zinc-900 #18181b, zinc-950 #09090b

#---- Base ----

@background = #0f0f11
@foreground = #fafafa
@accentColor = #fb923c
@disabledForeground = #52525b
@selectionBackground = #7c2d12
@selectionForeground = #fafafa
@selectionInactiveBackground = #27272a

Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
CheckBox.arc = 5
ProgressBar.arc = 8
Component.borderColor = #27272a
Component.disabledBorderColor = #18181b
Component.focusedBorderColor = #52525b
Component.focusColor = #fb923c40
Component.innerFocusWidth = 0
Component.focusWidth = 2
Component.accentColor = #fb923c

Panel.background = #0f0f11
Label.disabledForeground = #52525b
Separator.foreground = #27272a
TitledBorder.titleColor = #a1a1aa

#---- Buttons ----

Button.background = #18181b
Button.borderColor = #27272a
Button.hoverBackground = #27272a
Button.pressedBackground = #3f3f46
Button.focusedBorderColor = #52525b
Button.disabledBorderColor = #18181b
Button.default.background = #fafafa
Button.default.foreground = #18181b
Button.default.borderColor = #fafafa
Button.default.hoverBackground = #e4e4e7
Button.default.pressedBackground = #d4d4d8
Button.default.focusedBorderColor = #fafafa
Button.default.focusedBackground = #fafafa
Button.default.hoverBorderColor = #fafafa
Button.default.boldText = false
Button.toolbar.hoverBackground = #27272a
Button.toolbar.pressedBackground = #3f3f46
Button.toolbar.selectedBackground = #431407
Button.toolbar.margin = 4,4,4,4
Button.toolbar.spacingInsets = 1,1,1,1
ToggleButton.selectedBackground = #431407
ToggleButton.selectedForeground = #fdba74
ToggleButton.toolbar.selectedBackground = #431407
ToggleButton.toolbar.hoverBackground = #27272a

CheckBox.icon.borderColor = #3f3f46
CheckBox.icon.background = #0f0f11
CheckBox.icon.selectedBorderColor = #fafafa
CheckBox.icon.selectedBackground = #fafafa
CheckBox.icon.checkmarkColor = #18181b
CheckBox.icon.focusedBorderColor = #52525b
CheckBox.icon.hoverBorderColor = #71717a

#---- Text fields, combo boxes and spinners ----

TextField.background = #0f0f11
FormattedTextField.background = #0f0f11
TextComponent.selectionBackground = #7c2d12
ComboBox.background = #18181b
ComboBox.buttonStyle = none
ComboBox.buttonArrowColor = #a1a1aa
ComboBox.selectionBackground = #27272a
ComboBox.selectionForeground = #fafafa
Spinner.background = #0f0f11
Spinner.buttonStyle = none
Spinner.buttonArrowColor = #a1a1aa

#---- Lists, tables and trees ----

List.background = #0f0f11
List.selectionBackground = #27272a
List.selectionForeground = #fafafa
List.selectionInactiveBackground = #27272a
Table.background = #0f0f11
Table.selectionBackground = #2a1a10
Table.selectionForeground = #fafafa
Table.selectionInactiveBackground = #27272a
Table.gridColor = #1c1c1f
Table.showHorizontalLines = true
TableHeader.background = #141416
TableHeader.separatorColor = #27272a
TableHeader.bottomSeparatorColor = #27272a
Tree.background = #0f0f11
Tree.selectionBackground = #27272a
Tree.selectionForeground = #fafafa

#---- Tabs ----

TabbedPane.underlineColor = #fb923c
TabbedPane.inactiveUnderlineColor = #71717a
TabbedPane.hoverColor = #18181b
TabbedPane.focusColor = #0f0f11
TabbedPane.contentAreaColor = #27272a
TabbedPane.tabHeight = 30
TabbedPane.tabSeparatorColor = #27272a
TabbedPane.showTabSeparators = false

#---- Menus, popups and tooltips ----

MenuBar.borderColor = #27272a
