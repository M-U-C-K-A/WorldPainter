MenuItem.selectionBackground = #27272a
MenuItem.selectionForeground = #fafafa
MenuItem.selectionArc = 6
MenuItem.selectionInsets = 0,4,0,4
Menu.selectionBackground = #27272a
Menu.selectionForeground = #fafafa
CheckBoxMenuItem.selectionBackground = #27272a
RadioButtonMenuItem.selectionBackground = #27272a
ToolTip.background = #fafafa
ToolTip.foreground = #09090b
ToolTip.border = 6,10,6,10

#---- Scroll bars, sliders, progress bars ----

ScrollBar.width = 10
ScrollBar.showButtons = false
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.track = #00000000
ScrollBar.thumb = #3f3f46
ScrollBar.hoverThumbColor = #52525b
ScrollBar.pressedThumbColor = #71717a
Slider.trackWidth = 4
Slider.thumbSize = 14,14
Slider.trackColor = #27272a
Slider.trackValueColor = #fafafa
Slider.thumbColor = #09090b
