ComboBox.buttonEditableBackground = #4c5052
ComboBox.buttonArrowColor = #a9b0b6
ComboBox.selectionBackground = #4b6eaf
ComboBox.selectionForeground = #ffffff
Spinner.background = #45494a
Spinner.buttonStyle = button
Spinner.buttonBackground = #4c5052
