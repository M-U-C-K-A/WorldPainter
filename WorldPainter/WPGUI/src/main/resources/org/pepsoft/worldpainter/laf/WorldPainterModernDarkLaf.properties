# WorldPainter Modern, dark: a near black window with raised grey surfaces, a blue accent, softly rounded controls,
# and selections filled with the accent. Builds on WorldPainterDarkLaf.properties (Classic), of which it overrides
# the colours and shapes.
#
# Neutrals: #1c1c1e window, #262628 surface, #2c2c2e fill, #333336 hairline, #3a3a3c border, #48484a strong border,
# #636366 disabled, #98989d secondary text, #f5f5f7 text. Accent: #0a84ff, pressed #0070e0, tint #0a84ff2e.

#---- Base ----

@background = #1c1c1e
@foreground = #f5f5f7
@accentColor = #0a84ff
@disabledForeground = #636366
@selectionBackground = #0a84ff
@selectionForeground = #ffffff
@selectionInactiveBackground = #3a3a3c

Component.arc = 10
Button.arc = 10
TextComponent.arc = 10
CheckBox.arc = 6
ProgressBar.arc = 999
Component.borderColor = #3a3a3c
Component.disabledBorderColor = #2c2c2e
Component.focusedBorderColor = #0a84ff
Component.focusColor = #0a84ff4d
Component.innerFocusWidth = 0
Component.focusWidth = 3
Component.accentColor = #0a84ff
Component.linkColor = #4da3ff

Panel.background = #1c1c1e
Label.disabledForeground = #636366
Separator.foreground = #333336
TitledBorder.titleColor = #98989d

#---- Buttons ----

Button.background = #2c2c2e
Button.borderColor = #3a3a3c
Button.hoverBackground = #333336
Button.pressedBackground = #3a3a3c
Button.focusedBorderColor = #0a84ff
Button.disabledBorderColor = #2c2c2e
Button.default.background = #0a84ff
Button.default.foreground = #ffffff
Button.default.borderColor = #0a84ff
Button.default.hoverBackground = #2b95ff
Button.default.pressedBackground = #0070e0
Button.default.focusedBorderColor = #0a84ff
Button.default.focusedBackground = #0a84ff
Button.default.hoverBorderColor = #2b95ff
Button.default.boldText = true
Button.toolbar.hoverBackground = #2c2c2e
Button.toolbar.pressedBackground = #3a3a3c
Button.toolbar.selectedBackground = #0a84ff2e
Button.toolbar.margin = 5,5,5,5
ToggleButton.selectedBackground = #0a84ff2e
ToggleButton.selectedForeground = #64b0ff
ToggleButton.toolbar.selectedBackground = #0a84ff2e
ToggleButton.toolbar.hoverBackground = #2c2c2e

CheckBox.icon.background = #2c2c2e
CheckBox.icon.borderColor = #48484a
CheckBox.icon.selectedBorderColor = #0a84ff
CheckBox.icon.selectedBackground = #0a84ff
CheckBox.icon.checkmarkColor = #ffffff
CheckBox.icon.focusedBorderColor = #0a84ff
CheckBox.icon.hoverBorderColor = #636366

#---- Text fields, combo boxes and spinners ----

TextField.background = #2c2c2e
FormattedTextField.background = #2c2c2e
ComboBox.background = #2c2c2e
Spinner.background = #2c2c2e
TextComponent.selectionBackground = #0a84ff66
ComboBox.buttonArrowColor = #98989d
ComboBox.selectionBackground = #0a84ff
ComboBox.selectionForeground = #ffffff
Spinner.buttonArrowColor = #98989d

#---- Lists, tables and trees ----

List.background = #262628
List.selectionBackground = #0a84ff
List.selectionForeground = #ffffff
List.selectionInactiveBackground = #3a3a3c
List.selectionInactiveForeground = #f5f5f7
Table.background = #262628
Table.selectionBackground = #0a84ff33
Table.selectionForeground = #f5f5f7
Table.selectionInactiveBackground = #2c2c2e
Table.gridColor = #2c2c2e
TableHeader.background = #1c1c1e
TableHeader.separatorColor = #333336
TableHeader.bottomSeparatorColor = #333336
Tree.background = #262628
Tree.selectionBackground = #0a84ff
Tree.selectionForeground = #ffffff

#---- Tabs: a segmented control, the selected tab a raised pill ----

TabbedPane.tabHeight = 32
TabbedPane.tabInsets = 4,14,4,14
TabbedPane.tabAreaInsets = 4,8,4,8
TabbedPane.tabSelectionHeight = 32
TabbedPane.tabSelectionInsets = 3,2,3,2
TabbedPane.tabSelectionArc = 8
TabbedPane.tabArc = 8
TabbedPane.underlineColor = #3a3a3c
TabbedPane.inactiveUnderlineColor = #2c2c2e
TabbedPane.selectedForeground = #f5f5f7
TabbedPane.foreground = #98989d
TabbedPane.hoverColor = #2c2c2e
TabbedPane.focusColor = #1c1c1e
TabbedPane.contentAreaColor = #333336
TabbedPane.showTabSeparators = false

#---- Menus, popups and tooltips ----

MenuBar.borderColor = #333336
PopupMenu.background = #2c2c2e
PopupMenu.borderColor = #3a3a3c
PopupMenu.borderCornerRadius = 12
Popup.borderCornerRadius = 12
MenuItem.background = #2c2c2e
Menu.background = #2c2c2e
MenuItem.selectionBackground = #0a84ff
MenuItem.selectionForeground = #ffffff
MenuItem.selectionArc = 6
MenuItem.selectionInsets = 0,5,0,5
MenuItem.acceleratorSelectionForeground = #ffffffcc
Menu.selectionBackground = #0a84ff
Menu.selectionForeground = #ffffff
CheckBoxMenuItem.selectionBackground = #0a84ff
CheckBoxMenuItem.selectionForeground = #ffffff
RadioButtonMenuItem.selectionBackground = #0a84ff
RadioButtonMenuItem.selectionForeground = #ffffff
ToolTip.background = #2c2c2e
ToolTip.foreground = #f5f5f7
