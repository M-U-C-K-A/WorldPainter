#---- Scroll bars, sliders, progress bars ----

ScrollBar.width = 10
ScrollBar.thumb = #48484a
ScrollBar.hoverThumbColor = #636366
ScrollBar.pressedThumbColor = #7c7c80
Slider.trackWidth = 4
Slider.thumbSize = 16,16
Slider.trackColor = #3a3a3c
Slider.trackValueColor = #0a84ff
Slider.thumbColor = #f5f5f7
Slider.thumbBorderColor = #f5f5f7
Slider.hoverThumbColor = #ffffff
Slider.focusedColor = #0a84ff4d
ProgressBar.foreground = #0a84ff
ProgressBar.background = #3a3a3c

#---- Tool bars, title bar, split panes ----

ToolBar.background = #1c1c1e
ToolBar.separatorColor = #333336
TitlePane.background = #1c1c1e

#---- WorldPainter specific ----

WorldPainter.modern = true
WorldPainter.surface = #262628
WorldPainter.surfaceBorder = #333336
WorldPainter.canvasBackground = #141416
WorldPainter.canvasDot = #2c2c2e
WorldPainter.sidebarBackground = #1c1c1e
WorldPainter.border = #333336
WorldPainter.mutedForeground = #98989d
WorldPainter.icon = #c7c7cc
WorldPainter.warning = #ff9f0a
WorldPainter.accent = #0a84ff
WorldPainter.rowHover = #2c2c2e
WorldPainter.rowSelected = #0a84ff2e

# Node graph editor
WorldPainter.node.background = #262628
WorldPainter.node.border = #3a3a3c
WorldPainter.node.shadow = #00000066
WorldPainter.node.wire = #636366
WorldPainter.node.output = #0a84ff
