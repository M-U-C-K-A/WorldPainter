name: Release

# Pushing a tag such as v2.27.2-modernised.1 builds the native packages for every platform and publishes them as a
# GitHub release. The tag must match the version in the Maven POMs, with a v in front.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Check that the tag matches the version
        working-directory: WorldPainter
        run: |
          VERSION="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version in the POMs ($VERSION); tag v$VERSION instead"
            exit 1
          fi
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::$VERSION is a snapshot version; release a version without -SNAPSHOT"
            exit 1
          fi
      - name: Build
        working-directory: WorldPainter
        run: mvn -B -DskipTests install
      - name: Test
        working-directory: WorldPainter
        run: mvn -B -pl WPCore test

  package:
    name: Package (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            type: dmg
            suffix: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            type: dmg
            suffix: macos-x64
          - name: Windows
            os: windows-latest
            type: app-image
            suffix: windows-x64
          - name: Linux
            os: ubuntu-latest
            type: deb
            suffix: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fakeroot
      - name: Package
        shell: bash
        run: packaging/package.sh ${{ matrix.type }}
      - name: Name the package
        shell: bash
        run: |
          NAME="WorldPainter-Modernised-${GITHUB_REF_NAME#v}-${{ matrix.suffix }}"
          mkdir release
          case "${{ matrix.type }}" in
            dmg) mv dist/*.dmg "release/$NAME.dmg" ;;
            deb) mv dist/*.deb "release/$NAME.deb" ;;
          esac
          echo "PACKAGE_NAME=$NAME" >> "$GITHUB_ENV"
      - name: Zip application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/WorldPainter -DestinationPath "release/$env:PACKAGE_NAME.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/{{VERSION}}/$VERSION/g" packaging/release-notes.md > notes.md
          (cd release && sha256sum * > SHA256SUMS.txt)
          # Preview releases are marked as pre-releases; drop --prerelease once the fork is considered stable
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "WorldPainter Modernised $VERSION" \
            --notes-file notes.md \
            --prerelease \
            --verify-tag
