name: Build

on:
  push:
    # Tags are built by the release workflow
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build
        working-directory: WorldPainter
        run: mvn -B -DskipTests install
      - name: Test procedural terrain and edge blending
        working-directory: WorldPainter
        run: mvn -B -pl WPCore test -Dtest=ProceduralTerrainTest -Dsurefire.failIfNoSpecifiedTests=false

  package:
    name: Package (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            type: dmg
            artifact: dist/*.dmg
          - name: macOS Intel
            os: macos-15-intel
            type: dmg
            artifact: dist/*.dmg
          - name: Windows
            os: windows-latest
            type: app-image
            artifact: dist/*.zip
          - name: Linux
            os: ubuntu-latest
            type: deb
            artifact: dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fakeroot
      - name: Package
        shell: bash
        run: packaging/package.sh ${{ matrix.type }}
      - name: Zip application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/WorldPainter -DestinationPath dist/WorldPainter-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WorldPainter-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
